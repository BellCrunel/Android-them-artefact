name: Release APK (signed)

# Підписаний APK збирає GitHub, а не ваш комп'ютер: на раннері вже стоять
# JDK 17 і Android SDK, тож локально нічого встановлювати не треба.
#
# Щоб це запрацювало, у репозиторії мають бути три секрети
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   KEYSTORE_BASE64   - файл artefact-release.jks, закодований у base64
#   KEYSTORE_PASSWORD - пароль сховища
#   KEY_PASSWORD      - пароль ключа (зазвичай той самий)
#
# Як отримати base64 у PowerShell, з папки проєкту:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("artefact-release.jks")) | Set-Clipboard
# Далі просто вставити з буфера в поле секрету.
#
# Секрети НЕ видно в логах і НЕ видно стороннім, навіть у публічному репозиторії.

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Немає секрету KEYSTORE_BASE64. Див. коментар угорі цього файла."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > artefact-release.jks
          ls -l artefact-release.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=artefact-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=artefact"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Check the APK is actually signed
        run: |
          # Якщо пароль не збігся, Gradle мовчки робить *-unsigned.apk.
          # Краще впасти тут, ніж дізнатися про це на телефоні.
          if ls app/build/outputs/apk/release/*unsigned*.apk 1>/dev/null 2>&1; then
            echo "::error::APK вийшов НЕПІДПИСАНИМ — перевірте паролі в секретах."
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ArtefactLauncher.apk
          ls -l dist

      - name: Clean up secrets from the runner
        if: always()
        run: rm -f artefact-release.jks keystore.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtefactLauncher-release-apk
          path: dist/ArtefactLauncher.apk
          if-no-files-found: error
          retention-days: 30
