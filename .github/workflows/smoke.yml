name: Smoke test (emulator)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    strategy:
      fail-fast: false
      matrix:
        api-level: [ 34, 36 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator and collect logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh

      - name: Publish summary to run page
        if: always()
        run: |
          {
            echo "## Smoke API ${{ matrix.api-level }}"
            echo ""
            echo '```'
            if [ -f smoke-out/SUMMARY.txt ]; then
              head -c 45000 smoke-out/SUMMARY.txt
            else
              echo "(SUMMARY.txt not found - emulator step did not run)"
            fi
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Результати кладемо в окрему гілку, щоб Claude міг прочитати їх напряму
      # через raw.githubusercontent.com. Окрема гілка -> нові запуски не тригеряться.
      - name: Publish results to branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ matrix.api-level }}
        run: |
          set -x
          mkdir -p publish
          cp smoke-out/SUMMARY.txt                 publish/ 2>/dev/null || true
          cp smoke-out/app-startup_trace.txt       publish/ 2>/dev/null || true
          cp smoke-out/app-startup_trace-run2.txt  publish/ 2>/dev/null || true
          cp smoke-out/app-last_crash.txt          publish/ 2>/dev/null || true
          cp smoke-out/logcat-run1-crash.txt       publish/ 2>/dev/null || true
          cp smoke-out/logcat-run1-filtered.txt    publish/ 2>/dev/null || true
          cp smoke-out/steps.txt                   publish/ 2>/dev/null || true
          cp smoke-out/android-version.txt         publish/ 2>/dev/null || true
          cp smoke-out/start.txt                   publish/ 2>/dev/null || true
          ls -la publish > publish/INDEX.txt 2>/dev/null || true

          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -qb results
          git add -A
          git commit -q -m "smoke results api${API}" || exit 0
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            results:ci-results-api${API} || true

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api${{ matrix.api-level }}
          path: smoke-out/
          if-no-files-found: warn
          retention-days: 30
